<!DOCTYPE html>
<html>
<head>
    <title>Simple Bank Statement Converter</title>
    <style>
        body { font-family: sans-serif; }
        #upload-container { margin-bottom: 20px; }
        #output-container { margin-top: 20px; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; }
        #download-button { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Simple Bank Statement Converter</h1>
    <div id="upload-container">
        <input type="file" id="pdf-file" accept=".pdf">
        <button onclick="uploadAndConvert()">Convert</button>
    </div>
    <div id="output-container">
        <h2>Converted Data:</h2>
        <pre id="converted-text"></pre>
        <button id="download-button" style="display:none;">Download CSV</button>
    </div>

    <script>
        async function uploadAndConvert() {
            const fileInput = document.getElementById('pdf-file');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a PDF file.');
                return;
            }

            const formData = new FormData();
            formData.append('pdf_file', file);

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('converted-text').innerText = data;
                    const downloadButton = document.getElementById('download-button');
                    downloadButton.style.display = 'block';
                    downloadButton.onclick = () => downloadFile(data, 'converted_statement.csv', 'text/csv');
                } else {
                    const error = await response.text();
                    document.getElementById('converted-text').innerText = `Error: ${error}`;
                }
            } catch (error) {
                document.getElementById('converted-text').innerText = `Network error: ${error}`;
            }
        }

        function downloadFile(data, filename, mimeType) {
            const blob = new Blob([data], { type: mimeType });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
